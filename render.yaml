services:
  - type: web
    name: taskflow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/taskflow.sqlite3
    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
