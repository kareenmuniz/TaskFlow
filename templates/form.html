{% extends "base.html" %}
{% block title %}{{ page_title }} · TaskFlow{% endblock %}
{% block content %}
<section class="form-wrap">
  <a class="back" href="{{ url_for('index') }}">← Voltar para tarefas</a>
  <p class="eyebrow">ORGANIZAÇÃO</p><h1>{{ page_title }}</h1>
  <p class="muted">Preencha as informações da atividade.</p>
  <form method="post" class="task-form">
    <label for="title">Título <span>*</span></label>
    <input id="title" name="title" maxlength="120" required value="{{ task.get('title','') }}" placeholder="Ex.: Entregar atividade de programação">
    <label for="description">Descrição</label>
    <textarea id="description" name="description" maxlength="1000" rows="4" placeholder="Detalhes adicionais...">{{ task.get('description','') }}</textarea>
    <div class="form-grid">
      <div><label for="priority">Prioridade</label>
      <select id="priority" name="priority">
        {% for p in ['Baixa','Média','Alta'] %}<option value="{{ p }}" {% if task.get('priority','Média') == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select></div>
      <div><label for="due_date">Prazo</label><input id="due_date" type="date" name="due_date" value="{{ task.get('due_date','') }}"></div>
    </div>
    <div class="form-actions"><a class="button button-light" href="{{ url_for('index') }}">Cancelar</a><button class="button" type="submit">Salvar tarefa</button></div>
  </form>
</section>
{% endblock %}
